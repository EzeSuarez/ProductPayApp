services:
  postgres:
    image: postgres:15-alpine
    container_name: productpay_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: product_pay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_pay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
